# Throwaway WordPress + WooCommerce stack for taking directory screenshots and
# for testing the plugin on a clean install with WP_DEBUG on.
#
#   docker compose -f docker/docker-compose.yml up -d
#   → http://localhost:8088   (admin: demo / demo)
#
# The plugin folder is bind-mounted read-only, so edits on disk show up live.
# Everything lives in named volumes: `docker compose down -v` wipes it clean.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: wordpress
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    # 'latest' tracks current WordPress — WooCommerce requires 6.9+.
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # The review checklist asks for WP_DEBUG testing — this is that condition.
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', true );
        @ini_set( 'display_errors', 1 );
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/matrixweave-for-woocommerce:ro

  # Run one-off commands: docker compose -f docker/docker-compose.yml run --rm wpcli wp <cmd>
  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/matrixweave-for-woocommerce:ro
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  db:
  wp:
